# Dependabot configuration — https://docs.github.com/code-security/dependabot
version: 2

updates:
  # npm dependencies (package.json / package-lock.json)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Bogota"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # Collapse routine dev-tooling bumps into a single PR to cut noise.
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Bumping this past the engines floor would silently drop support for
      # older VS Code versions — review those manually.
      - dependency-name: "@types/vscode"
        update-types: ["version-update:semver-major"]

  # GitHub Actions — mantiene al día los SHA pineados de ci/commitlint/release/
  # codeql/security (Dependabot bumpea el pin y actualiza el comentario # vX.Y.Z).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
