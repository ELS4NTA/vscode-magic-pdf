# Dependabot configuration — https://docs.github.com/code-security/dependabot
version: 2

updates:
  # npm dependencies (package.json / package-lock.json)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Bogota"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # Patches never get their own PR: they ride along in a single weekly
      # rollup. Security updates are exempt (groups only apply to version
      # updates), so a CVE fixed by a patch still opens its own PR.
      patch-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "patch"
      # Collapse routine dev-tooling bumps into a single PR to cut noise.
      dev-dependencies:
        applies-to: version-updates
        dependency-type: "development"
        update-types:
          - "minor"
    ignore:
      # Pinned to the engines.vscode floor on purpose: any bump lets the
      # compiler accept APIs missing from the oldest supported editor, and
      # vsce rejects the package outright. Raise engines.vscode first.
      - dependency-name: "@types/vscode"

  # GitHub Actions — keeps the pinned SHAs for ci/commitlint/release/codeql/
  # security up to date (Dependabot bumps the pin and rewrites the # vX.Y.Z tag).
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "ci"
    groups:
      # Same rule as npm: patch bumps land as one rollup PR, not one each.
      patch-updates:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "patch"
